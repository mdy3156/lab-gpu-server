# Nginx HTTPS reverse proxy for lab-gpu-server.
#
# Install with:
#   sudo bash /opt/lab-server/scripts/setup-nginx-https.sh
#
# Replace the placeholders through the setup script or edit the installed file:
#   /etc/nginx/conf.d/lab-server-jupyterhub.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name __LAB_SERVER_NAME__;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __LAB_SERVER_NAME__;

    ssl_certificate __LAB_SERVER_TLS_CERT__;
    ssl_certificate_key __LAB_SERVER_TLS_KEY__;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10G;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Scheme https;
    }
}
